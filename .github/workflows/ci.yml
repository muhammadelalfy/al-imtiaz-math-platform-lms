name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Next.js frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run Next.js lint
        run: pnpm --dir frontend lint

      - name: Run Next.js TypeScript checks
        run: pnpm --dir frontend check

      - name: Run Next.js unit tests
        run: pnpm --dir frontend test

      - name: Build Next.js frontend
        run: pnpm --dir frontend build

      - name: Install Playwright Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run Next.js end-to-end tests
        run: pnpm --dir frontend exec playwright test

  laravel:
    name: Laravel checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          mkdir -p database
          touch database/database.sqlite
          cat > .env <<EOF
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=sqlite
          DB_DATABASE=$PWD/database/database.sqlite
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          EOF
          php artisan key:generate

      - name: Run PHP syntax checks
        run: find app Modules tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run Laravel migrations
        run: php artisan migrate --force

      - name: Run Larastan static analysis
        run: composer analyse

      - name: Run Laravel tests
        run: php artisan test --compact
